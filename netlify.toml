# Netlify konfigurasjon for Sykdomslære Quiz

[build]
  publish = "."
  # Ingen build command – statisk side

# SPA fallback redirect
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Caching headers for static assets
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
