<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Quiz for sykepleiestudenter - eksamensforberedelse i sykdomslære">
    <title>Sykdomslære – Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <h1>Sykdomslære – Quiz</h1>
        <p class="subtitle">Eksamensforberedelse for sykepleie</p>
    </header>

    <main class="app-main">
        <!-- VIEW 1: Setup -->
        <section id="setup-view" class="view">
            <h2>Velg quiz</h2>

            <div class="card">
                <label for="category-select">Kategori:</label>
                <select id="category-select">
                    <option value="">-- Velg kategori --</option>
                </select>
            </div>

            <div class="card">
                <label for="difficulty-select">Vanskelighetsgrad:</label>
                <select id="difficulty-select">
                    <option value="easy">Lett</option>
                    <option value="medium">Medium</option>
                    <option value="exam">Eksamen</option>
                    <option value="all">Alle</option>
                </select>
            </div>

            <div class="card">
                <label>Modus:</label>
                <div class="mode-buttons">
                    <button id="btn-training" class="btn btn-secondary">Trening</button>
                    <button id="btn-exam" class="btn btn-secondary">Eksamen</button>
                </div>
            </div>

            <button id="btn-start" class="btn btn-primary" disabled>Start quiz</button>
        </section>

        <!-- VIEW 2: Quiz -->
        <section id="quiz-view" class="view hidden">
            <div class="quiz-header">
                <span id="quiz-progress">Spørsmål 1 / 10</span>
                <span id="quiz-timer" class="hidden">20:00</span>
            </div>

            <div class="progress-bar">
                <div id="progress-fill" class="progress-fill"></div>
            </div>

            <article class="question-card">
                <span id="question-type" class="badge">Flervalg</span>
                <p id="question-text" class="question-text">Spørsmålet vises her...</p>

                <div id="options-container" class="options">
                    <!-- Svaralternativer fylles inn av JS -->
                </div>
            </article>

            <div id="feedback-container" class="feedback hidden">
                <p id="feedback-text"></p>
                <p id="feedback-explanation"></p>
            </div>

            <div class="quiz-actions">
                <button id="btn-next" class="btn btn-primary hidden">Neste</button>
                <button id="btn-quit" class="btn btn-secondary">Avslutt</button>
            </div>
        </section>

        <!-- VIEW 3: Results -->
        <section id="result-view" class="view hidden">
            <h2>Resultater</h2>

            <div class="score-display">
                <span id="score-percent" class="score-big">0%</span>
                <span class="score-label">riktig</span>
            </div>

            <div class="score-details">
                <div class="detail">
                    <span id="score-correct">0</span>
                    <span>Riktige</span>
                </div>
                <div class="detail">
                    <span id="score-wrong">0</span>
                    <span>Feil</span>
                </div>
                <div class="detail">
                    <span id="score-total">0</span>
                    <span>Totalt</span>
                </div>
            </div>

            <div id="result-message" class="card"></div>

            <div class="result-actions">
                <button id="btn-retry" class="btn btn-primary">Prøv igjen</button>
                <button id="btn-back" class="btn btn-secondary">Tilbake</button>
            </div>
        </section>
    </main>

    <footer class="app-footer">
        <p>&copy; 2025 Sykdomslære Quiz</p>
    </footer>

    <!-- Scripts i riktig rekkefølge -->
    <script src="js/state.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/quiz-engine.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
